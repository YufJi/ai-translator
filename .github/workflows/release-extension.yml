name: Release Extension

# 打 tag（形如 v0.1.0）→ 校验 + 打包 + 挂到 GitHub Release；
# 手动触发（workflow_dispatch）只产出 artifact，不创建 Release，方便先试跑。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build & package extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 故意不传 version：action-setup 会读取 package.json 的 packageManager
      # 字段；额外传 version 会因「Multiple versions of pnpm specified」失败。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # verify = build → typecheck → test。必须先构建，扩展产物相关的用例
      #（dist 存在时才执行）才会真正跑起来。
      - name: Verify (build, typecheck, tests)
        run: pnpm verify

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./apps/extension/manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag 与 apps/extension/manifest.json 的 version $version 不一致；Chrome 要求 manifest 版本随发布递增，请先同步再打 tag"
            exit 1
          fi
          echo "tag 与 manifest 版本一致：$version"

      - name: Package zip
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/extension/manifest.json').version")
          name="ai-translator-extension-v${version}"
          # manifest.json 必须在压缩包根目录，Chrome 才能直接加载；*.map 是给
          # 本地调试用的，不进发布包。
          (cd apps/extension/dist && zip -r "../../../${name}.zip" . -x '*.map')
          unzip -l "${name}.zip" | awk '{print $4}' | grep -qx 'manifest.json'
          unzip -l "${name}.zip"
          {
            echo "ZIP=${name}.zip"
            echo "VERSION=${version}"
          } >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-v${{ env.VERSION }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      # 用 runner 自带的 gh，少引入一个第三方 action；重复执行同一个 tag 时
      # 覆盖已有 asset 而不是报错。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
